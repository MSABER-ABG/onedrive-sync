name: Sync Excel via share link

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas openpyxl

      - run: python scripts/sync_sharelink.py
        env:
          SHARE_URL: ${{ secrets.SHARE_URL }}
          DEST_PATH: data/report.xlsx
          EXPORT_CSV: "true"

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: sync workbook from OneDrive"
          git push
